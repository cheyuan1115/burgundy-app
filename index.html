<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Burgundy AOC — 3D 可傾斜版（MapLibre GL）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .ui{
      position: absolute; z-index: 10; 
      top: 8px; 
      left: 8px; 
      max-height: 90vh; 
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      width: min(88vw, 320px); /* 縮小寬度以避免遮擋地圖控制 */
      font: 14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    /* 確保 AOC 輸入欄的寬度 */
    .ui #q{ 
      flex-grow: 1; 
      max-width: 260px;
    }
    .ui input[type="text"]{ 
      flex-grow: 1; 
      padding:8px 10px; 
      border:1px solid #ddd; 
      border-radius:8px; 
      font:inherit; 
    }
    .btn{ padding:6px 10px; border:1px solid #ddd; border-radius:8px; background:#f8f8f8; cursor:pointer; font:12px; white-space:nowrap; }
    .btn:hover{ background:#eee; }
    label.small{ font-size:12px; color:#666; }
    /* 新增的 UI 樣式 */
    .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .slider-row input[type="range"] { flex-grow: 1; }
    /* 酒莊搜尋欄位樣式 */
    .winery-search-box{ margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }


    .legend{
      position:absolute; z-index:10; right:12px; bottom:12px; background:#fff; padding:10px;
      border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.18); font:13px system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .legend .item{ display:flex; align-items:center; gap:8px; margin:4px 0; }
    .swatch{ width:16px; height:12px; border:2px solid #000; border-radius:3px }
    .gc{ border-color:#cc0033; background:#cc003322 }
    .pc{ border-color:#ff7f0e; background:#ff7f0e33 }
    .vi{ border-color:#1f77b4; background:#1f77b433 }
    .re{ border-color:#2ca02c; background:#2ca02c33 }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="ui">
    <div class="row"><b>AOC 篩選</b></div>
    <div class="row">
      <!-- 為了讓 flex 設置生效，為其添加 ID -->
      <input id="q" type="text" placeholder="例如：Meursault / La Romanee">
      <button class="btn" id="showAll">全部</button>
      <button class="btn" id="toggleWineries" title="顯示酒莊">🚫🍷</button>
    </div>
    
    <!-- ************ 新增酒莊搜尋欄位 ************ -->
    <div class="winery-search-box">
      <div class="row"><b>酒莊搜尋</b></div>
      <div class="row">
        <input id="winery-q" type="text" placeholder="例如：DRC / Romanée-Conti">
        <button class="btn" id="clear-winery">清除</button>
      </div>
    </div>
    <!-- **************************************** -->
  </div>


  <div class="legend">
    <div class="item"><span class="swatch gc"></span> Grand Cru</div>
    <div class="item"><span class="swatch pc"></span> Premier Cru</div>
    <div class="item"><span class="swatch vi"></span> Village</div>
    <div class="item"><span class="swatch re"></span> Régionale / 其他</div>
  </div>

  <script>
    // ====== 設定 ======
    const AOC_DATA_FILE = './burgundy.geojson';
    const WINERY_DATA_FILE = './wineries.geojson';
    const START = { lng: 4.80, lat: 47.00, zoom: 8.8, pitch: 45, bearing: 0 };


    // ====== 名稱正規化 & 分級判定 ======
    
    // 正規化
    function _norm(s=''){
      return s.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // 去重音
        .replace(/['’`´\.·]/g,'')                         // 去標點
        .replace(/st[\.\s]/g,'saint ')                    // St→Saint
        .replace(/[\-–—]/g,' ')                           // 各式連字號轉空白
        .replace(/[\s\u00A0\u2000-\u200D]+/g,'')          // 消所有空白
        .trim();
    }
    
    /* ---------- 常數 ---------- */
    const GC_LIST = [
      "Chambertin","Chambertin-Clos de Bèze","Mazis-Chambertin","Charmes-Chambertin","Griotte-Chambertin","Latricières-Chambertin","Ruchottes-Chambertin","Mazoyères-Chambertin",
      "Clos de la Roche","Clos Saint-Denis","Clos des Lambrays","Clos de Tart","Bonnes-Mares","Musigny","Clos de Vougeot",
      "Échezeaux","Grands Échezeaux","Richebourg","Romanée-Conti","La Romanée","Romanée-Saint-Vivant","La Tâche","La Grande Rue",
      "Corton","Corton-Charlemagne","Charlemagne",
      "Montrachet","Bâtard-Montrachet","Chevalier-Montrachet","Criots-Bâtard-Montrachet","Bienvenues-Bâtard-Montrachet",
      "Chablis Grand Cru"
    ];
    const GC_NORM = GC_LIST.map(_norm);

    const GC_ALIASES = new Map([
      [_norm("Clos Vougeot"), "Clos de Vougeot"],
      [_norm("Clos de Vougeot ou Clos Vougeot"), "Clos de Vougeot"],
    ]);

    const GC_HOME = {
      "Chambertin": ["Gevrey-Chambertin"],
      "Chambertin-Clos de Bèze": ["Gevrey-Chambertin"],
      "Clos de Vougeot": ["Vougeot"],
      "Richebourg": ["Vosne-Romanée"],
      "Romanée-Conti": ["Vosne-Romanée"],
      "Montrachet": ["Puligny-Montrachet","Chassagne-Montrachet"],
      "Corton": ["Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"],
      "Chablis Grand Cru": ["Chablis"]
    };

    const VILLAGES = [
      "Chablis","Marsannay","Fixin","Gevrey-Chambertin","Morey-Saint-Denis","Chambolle-Musigny","Vougeot",
      "Vosne-Romanée","Nuits-Saint-Georges","Beaune","Pommard","Volnay","Meursault",
      "Puligny-Montrachet","Chassagne-Montrachet","Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"
    ];
    const VILL_NORM = VILLAGES.map(_norm);

    /* ---------- 單一版解析器（判斷等級並傳回顯示名稱） ---------- */
    function parseAOC(props){
      const raw = String(props?.denom || '');
      const parts = raw.split(',').map(s=>s.trim()).filter(Boolean);
      const partsNorm = parts.map(_norm);

      // 1) Grand Cru
      for (let i=0;i<parts.length;i++){
        const pn = partsNorm[i];
        let gcCanon = GC_ALIASES.get(pn) ?? null;
        if (!gcCanon){
          const idx = GC_NORM.indexOf(pn);
          if (idx !== -1) gcCanon = GC_LIST[idx];
        }
        if (gcCanon){
          const home = GC_HOME[gcCanon] || [];
          return { level:'GC', title: gcCanon, subtitle: home.length ? `地點：${home.join(' / ')}` : '' };
        }
      }

      // 2) Premier Cru
      const pcParts = parts.filter(p => /(premier|1er)\s*cru/i.test(p));
      if (pcParts.length){
        let titleAOC = 'Premier Cru';
        
        // 🚨 最終修復邏輯：從第一個找到的 PC 片段中，直接提取 'premier cru' 前面的所有文字作為村莊名
        for(const p of pcParts) {
            // 正則：從開頭匹配到 'premier cru'，並將其前面的部分作為 Village 名稱
            const m = p.match(/^(.+?)\s+(premier|1er)\s*cru/i);
            if (m && m[1]) {
                const villagePartRaw = m[1].trim();
                
                // 檢查是否是無意義的名稱，例如 'bourgogne' 或只有一個字母
                if (villagePartRaw.length > 2 && villagePartRaw.toLowerCase() !== 'bourgogne') {
                   // 重新格式化成正確的標題
                   titleAOC = villagePartRaw + ' Premier Cru'; 
                   break;
                }
            }
        }
        
        // 提取地塊名稱
        const climats = pcParts.map(p => {
          let tail = '';
          const m = p.match(/(?:premier|1er)\s*cru\s*([:\/–—\-]*\s*.*)$/i);
          if (m && m[1]) tail = m[1].trim();
          tail = tail.replace(/^[\s:\/–—\-]+/, '').replace(/^\((.*)\)$/, '$1').trim();
          if (!tail || /premier\s*cru/i.test(tail)) return '';
          return tail;
        }).filter(Boolean);
        const allClimats = climats
          .flatMap(c => c.split(/\s*,\s*/))
          .map(s => s.trim())
          .filter(Boolean);

        const title = titleAOC;
        const subtitle = allClimats.length ? `地塊：${allClimats.join(', ')}` : '';
        return { level:'PC', title, subtitle };
      }

      // 3) Village
      for (let i=0;i<parts.length;i++){
        const idx = VILL_NORM.indexOf(partsNorm[i]);
        if (idx !== -1){
          return { level:'VI', title: VILLAGES[idx], subtitle:'Village' };
        }
      }

      // 4) Régionale / 其他
      return { level:'RE', title: parts[0] || 'AOC', subtitle: 'Régionale / 其他' };
    }

    const getLevel = (props) => parseAOC(props).level;

    // ====== Map 初始化（MapLibre GL）======
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          'osm': {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            maxzoom: 19,
            attribution: '© OpenStreetMap contributors'
          },
          'terrain-dem': {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 15,
            encoding: 'terrarium'
          }
        },
        layers: [
          { id: 'osm', type: 'raster', source: 'osm' }
        ],
        terrain: { source: 'terrain-dem', exaggeration: 3.0 }
      },
      center: [START.lng, START.lat],
      zoom: START.zoom,
      pitch: START.pitch,
      bearing: START.bearing,
      antialias: true,
      hash: false
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // ====== 載入資料並建立圖層 ======
    let masterAOC = null;
    let masterWineries = null; // 新增：保存原始酒莊數據
    let currentFilterQ = '';
    let wineriesVisible = false; // 預設為隱藏

    map.on('load', async () => {

      // 1) 載入 meta.json
      let META = { wineries: {} };
      try {
        const mRes = await fetch('./meta.json');
        META = await mRes.json();
      } catch (e) {
        console.warn('meta.json 載入失敗：', e);
      }

      // Sky + Hillshade
      map.addLayer({
        id: 'sky',
        type: 'sky',
        paint: {
          'sky-type': 'atmosphere',
          'sky-atmosphere-sun': [0.0, 0.0],
          'sky-atmosphere-sun-intensity': 12
        }
      });

      map.addLayer({
        id: 'hillshade',
        type: 'hillshade',
        source: 'terrain-dem',
        layout: { visibility: 'visible' },
        paint: {
          'hillshade-exaggeration': 1.0, // 增強陰影視覺效果
          'hillshade-shadow-color': 'rgba(0,0,0,0.55)',
          'hillshade-illumination-direction': 315
        }
      });

      // AOC
      const aocRes = await fetch(AOC_DATA_FILE);
      masterAOC = await aocRes.json();

      const enrich = (fc) => ({
        type: 'FeatureCollection',
        features: (fc.features || []).map(f => {
          const p = f.properties || {};
          const lvl = getLevel(p);
          return { ...f, properties: { ...p, lvl } };
        })
      });

      map.addSource('aoc', { type: 'geojson', data: enrich(masterAOC), promoteId: 'id', generateId: true });

      // Fill 著色
      map.addLayer({
        id: 'aoc-fill',
        type: 'fill',
        source: 'aoc',
        paint: {
          'fill-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            /* 其他（RE）*/ '#2ca02c'
          ],
          'fill-opacity': [
            'match', ['get', 'lvl'],
            'GC', 0.18,
            'PC', 0.16,
            'VI', 0.14,
            /* RE */   0.12
          ]
        }
      });

      // 邊線
      map.addLayer({
        id: 'aoc-line',
        type: 'line',
        source: 'aoc',
        paint: {
          'line-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            /* RE */ '#2ca02c'
          ],
          'line-width': 1.2
        }
      });

      // Hover 高亮
      map.addLayer({
        id: 'aoc-line-hl',
        type: 'line',
        source: 'aoc',
        paint: {
          'line-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            '#2ca02c'
          ],
          'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2.4, 0]
        }
      });
      

      let hoveredId = null;
      map.on('mousemove', 'aoc-fill', (e) => {
        if (!e.features?.length) return;
        const f = e.features[0];
        if (hoveredId !== null) map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: false });
        hoveredId = f.id;
        map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: true });
      });
      map.on('mouseleave', 'aoc-fill', () => {
        if (hoveredId !== null) map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: false });
        hoveredId = null;
      });

      // --- 點擊 AOC 顯示彈窗 ---
      map.on('click', 'aoc-fill', (e) => {
        const f = e.features && e.features[0];
        if (!f) return;

        const info = parseAOC(f.properties || {});
        const levelText = { GC:'Grand Cru', PC:'Premier Cru', VI:'Village', RE:'Régionale / 其他' }[info.level] || 'AOC';
        
        // 確保地塊/地點的標籤正確且不重複
        let subText = '';
        if (info.level === 'PC') {
            // Premier Cru: 顯示地塊
            subText = info.subtitle ? `地塊：${info.subtitle.replace('地塊：', '')}` : ''; 
        } else if (info.level === 'GC') {
            // Grand Cru: 顯示地點
            subText = info.subtitle ? `地點：${info.subtitle.replace('地點：', '')}` : ''; 
        }
        
        const subRow = subText ? `<div class="small" style="color:#666;margin-top:2px">${subText}</div>` : ''; 

        const key = _norm(info.title || '');
        const meta = META[key] || null;

        // 只有在有 meta 資料時才顯示 extra 區塊
        const extra = meta ? `
          <div style="margin-top:8px">
          <div class="small" style="margin-top:6px">
            <b>${meta.zh || info.title}</b>｜${meta.level || levelText}<br>
            村莊：${meta.village || '未知'}
          </div>
          <div class="small" style="color:#555;margin-top:6px">${meta.notes || ''}</div>
          ${meta.link ? `<div class="small" style="margin-top:4px">
            <a href="${meta.link}" target="_blank" rel="noopener">🔗 Wine-Searcher</a>
          </div>` : ''}
          </div>
        ` : '';

        // 最終輸出：標題 -> 等級 -> 地塊/地點 -> Meta資料
        new maplibregl.Popup({ closeOnClick: true })
          .setLngLat(e.lngLat)
          .setHTML(
            `<div style="min-width:260px">
               <div style="font-weight:700">${info.title}</div>
               <div class="small" style="color:#666;margin-top:6px">等級：${levelText}</div>
               ${subRow}   <!-- 插入地塊/地點名 -->
               ${extra}    <!-- 插入 meta 資料 (如果存在) -->
             </div>`
          )
          .addTo(map);
      });

      // 酒莊圖層設定
      const wRes = await fetch(WINERY_DATA_FILE);
      masterWineries = await wRes.json(); // 保存原始數據
      map.addSource('wineries', { type: 'geojson', data: masterWineries });
      
      // 使用 circle 確保穩定顯示
      map.addLayer({
        id: 'wineries',
        type: 'circle',
        source: 'wineries',
        layout: { 'visibility': 'none' }, // 預設為隱藏
        paint: {
          'circle-radius': 4.5,
          'circle-color': '#7b1fa2', // 紫色
          'circle-stroke-width': 1,
          'circle-stroke-color': '#ffffff'
        }
      });
      
      // ===== 酒莊互動：滑入改游標、點擊顯示 popup（含 meta 合併） =====
      map.on('mouseenter', 'wineries', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'wineries', () => { map.getCanvas().style.cursor = ''; });

      map.on('click', 'wineries', (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        const p = f.properties || {};

        const key =
          (p.id && String(p.id)) ||
          (p.place_id && String(p.place_id)) ||
          _norm(p.name || '');

        const m =
          (META.wineries && (META.wineries[key] || META.wineries[_norm(p.name || '')])) ||
          null;

        const name  = (m && (m.display_name || m.name)) || p.name || 'Winery';
        const addr  = (m && m.address)  || p.address  || '';
        const phone = (m && m.phone)    || p.phone    || '';
        const site  = (m && m.website)  || p.website  || '';
        const note  = (m && (m.note || m.notes)) || '';

        const html = `
          <div style="min-width:240px">
            <div style="font-weight:700">${name}</div>
            ${addr  ? `<div class="small" style="color:#555">${addr}</div>` : ''}
            ${phone ? `<div class="small" style="color:#555">☎ ${phone}</div>` : ''}
            ${site  ? `<div class="small"><a href="${site}" target="_blank" rel="noopener">網站</a></div>` : ''}
            ${note  ? `<div class="small" style="color:#555;margin-top:6px">${note}</div>` : ''}
          </div>
        `;

        new maplibregl.Popup({ closeOnClick: true })
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      });


      // ====== AOC 搜尋（直接對 masterAOC 篩選後 setData）======
      async function applySearch(qRaw){
        currentFilterQ = _norm(qRaw || ''); 
        const feats = (masterAOC.features || []).filter(f => {
          if (!currentFilterQ) return true;
          const denom = f.properties?.denom || '';
          const names = denom.split(',').map(s => s.trim()).filter(Boolean);
          const score = Math.max(...names.map(n => {
            const nn = _norm(n);
            if (nn === currentFilterQ) return 100;
            if (nn.startsWith(currentFilterQ)) return 50;
            if (nn.includes(currentFilterQ)) return 10;
            return 0;
          }));
          return score > 0;
        });

        const filtered = { type:'FeatureCollection', features: feats.map(f => {
          const p = f.properties || {};
          return { ...f, properties: { ...p, lvl: getLevel(p) } };
        })};

        map.getSource('aoc').setData(filtered);

        if (feats.length) {
          const b = new maplibregl.LngLatBounds();
          
          const addCoords = (coords) => {
            if (Array.isArray(coords) && coords.length >= 2 && typeof coords[0] === 'number') {
              b.extend(coords);
            } else if (Array.isArray(coords)) {
              coords.forEach(addCoords);
            }
          };

          feats.forEach(f => {
            const geom = f.geometry;
            if (geom && geom.coordinates) {
               addCoords(geom.coordinates);
            }
          });
          
          if (b.isEmpty()) {
              console.warn("AOC 搜尋：計算出的邊界框為空。");
              return;
          }
          
          map.fitBounds(b, { padding: 40, maxZoom: 14, duration: 600 });
        }
      }
      
      // ************ 新增酒莊搜尋邏輯 ************
      function applyWinerySearch(qRaw){
        const qNorm = _norm(qRaw || ''); 
        
        if (!map.getSource('wineries')) return;

        if (!qNorm) {
            // 清空搜尋：顯示所有酒莊
            map.setFilter('wineries', null);
            return;
        }

        // 搜尋邏輯：檢查 properties.name 是否包含或匹配搜尋字串
        // 使用 MapLibre GL 的 Filter 語法: ['match', ['get', 'name'], '搜索字串', true, false]
        // 為了實現「包含」和「忽略大小寫/重音」的邏輯，我們必須依賴 GeoJSON 數據中的屬性是否已經被「正規化」
        // 由於原始數據沒有正規化名稱，我們將使用一個簡單的「包含」過濾器，它區分大小寫，但這是 GeoJSON 來源的限制
        
        // *緊急修復：為了讓搜尋能忽略大小寫，我們改用 [case, ...] 來模擬，但這會讓過濾器更複雜*
        
        // 假設 GeoJSON 中的 'name' 屬性是純英文
        // [
        //   "any",
        //   ["in", ["to-lowercase", qNorm], ["to-lowercase", ["get", "name"]]], // 包含
        //   ["in", ["to-lowercase", qNorm], ["to-lowercase", ["get", "address"]]] // 包含地址 (如果有的話)
        // ]
        
        // 由於 MapLibre GL 的 expression 中沒有 to-lowercase，我們只能用大小寫敏感的 includes/in 或 startsWith
        // 為了避免複雜的表達式導致效能問題，我們採用 startsWith 敏感過濾：
        
        // MapLibre GL JS Filter: ["has", "name"] 並且 name starts with Q
        const filter = [
          'all',
          ['has', 'name'],
          ['match', ['get', 'name'], [`*${qRaw}*`], true, false] // 使用 MapLibre 的 glob-style 匹配 (如果 GeoJSON 來源支援)
        ];
        
        // *** MapLibre GL JS 對 GeoJSON Source 的 Filter 限制：它不支持複雜的字符串操作。***
        // *** 最簡單且可靠的 GeoJSON 過濾方法：檢查屬性是否存在且其值等於或以某個字符串開頭 (大小寫敏感)。***

        // 採用最保守的 'in' 篩選器（它在 MapLibre GL 中對於 GeoJSON 有時是可用的，但通常是全等匹配）
        // 為了讓它工作，我們必須在程式碼中過濾 masterWineries 並調用 setData，而不是 setFilter
        
        // 重新設計酒莊搜尋：通過程式碼過濾然後更新 Source Data
        const filteredWineries = masterWineries.features.filter(f => {
          if (!qNorm) return true;
          const name = _norm(f.properties?.name || '');
          const addr = _norm(f.properties?.address || '');
          const combined = `${name} ${addr}`;
          return combined.includes(qNorm);
        });
        
        map.getSource('wineries').setData({ type: 'FeatureCollection', features: filteredWineries });
        
        // 找到並飛向第一個結果
        if (filteredWineries.length > 0) {
            const firstFeature = filteredWineries[0];
            const coords = firstFeature.geometry.coordinates;
            if (coords && coords.length === 2 && typeof coords[0] === 'number') {
                map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 12), duration: 600 });
            }
        }
      }
      // ****************************************


      // 綁定 UI
      const q = document.getElementById('q');
      const btnAll = document.getElementById('showAll');
      const btnWineries = document.getElementById('toggleWineries');
      
      const wineryQ = document.getElementById('winery-q'); // 新增酒莊輸入欄
      const btnClearWinery = document.getElementById('clear-winery'); // 新增酒莊清除按鈕
      
      
      let tAOC = null;
      q.addEventListener('input', ()=>{ clearTimeout(tAOC); tAOC = setTimeout(()=> applySearch(q.value), 220); });
      btnAll.onclick   = ()=> { q.value=''; applySearch(''); };
      
      // 🍷 酒莊顯示功能實作 - 使用圖示切換
      btnWineries.onclick = () => {
        const currentVis = map.getLayoutProperty('wineries', 'visibility') === 'visible';
        const newVis = currentVis ? 'none' : 'visible';
        
        map.setLayoutProperty('wineries', 'visibility', newVis);
        
        if (newVis === 'visible') {
            btnWineries.textContent = '🍷';
            btnWineries.title = '隱藏酒莊';
        } else {
            btnWineries.textContent = '🚫🍷'; // 🚫 表示禁止或隱藏
            btnWineries.title = '顯示酒莊';
        }
        wineriesVisible = !currentVis;
      };

      // ************ 綁定酒莊搜尋 UI ************
      let tWinery = null;
      wineryQ.addEventListener('input', ()=>{ clearTimeout(tWinery); tWinery = setTimeout(()=> applyWinerySearch(wineryQ.value), 220); });
      
      btnClearWinery.onclick = ()=> { 
        wineryQ.value = ''; 
        applyWinerySearch('');
        // 確保酒莊圖層在清除搜尋後是可見的
        if (map.getLayoutProperty('wineries', 'visibility') !== 'visible') {
            map.setLayoutProperty('wineries', 'visibility', 'visible');
            btnWineries.textContent = '🍷';
            btnWineries.title = '隱藏酒莊';
        }
      };
      // ****************************************

      // 視角控制程式碼 (為保持完整性保留)
      const pitchEl = document.getElementById('pitch');
      const pitchVal = document.getElementById('pitchVal');
      if (pitchEl) pitchEl.oninput = () => {
        const v = Number(pitchEl.value)||0;
        map.setPitch(v);
        pitchVal.textContent = v + '°';
      };

      const bearingEl = document.getElementById('bearing');
      const bearingVal = document.getElementById('bearingVal');
      if (bearingEl) bearingEl.oninput = () => {
        const v = Number(bearingEl.value)||0;
        map.setBearing(v);
        bearingVal.textContent = v + '°';
      };

      const exgEl = document.getElementById('exg');
      const exgVal = document.getElementById('exgVal');
      if (exgEl) exgEl.oninput = () => {
        const v = (Number(exgEl.value)||150) / 100; // 100% => 1.0
        exgVal.textContent = (v*100).toFixed(0) + '%';
        const style = map.getStyle();
        if (style && style.terrain) {
          map.setTerrain({ source: 'terrain-dem', exaggeration: v });
        }
      };

      const resetBtn = document.getElementById('resetView');
      if (resetBtn) resetBtn.onclick = () => {
        map.flyTo({ center:[START.lng, START.lat], zoom: START.zoom, pitch: START.pitch, bearing: START.bearing, duration: 700 });
        if (pitchEl) pitchEl.value = START.pitch; if (pitchVal) pitchVal.textContent = START.pitch + '°';
        if (bearingEl) bearingEl.value = START.bearing; if (bearingVal) bearingVal.textContent = START.bearing + '°';
        if (exgEl) exgEl.value = 150; if (exgVal) exgVal.textContent = '150%';
        const style = map.getStyle(); if (style && style.terrain) map.setTerrain({ source: 'terrain-dem', exaggeration: 3.0 });
      };

      // Hillshade / Sky 開關
      const toggleShadeBtn = document.getElementById('toggleShade');
      if (toggleShadeBtn) toggleShadeBtn.onclick = () => {
        const vis = map.getLayoutProperty('hillshade', 'visibility') === 'visible' ? 'none' : 'visible';
        map.setLayoutProperty('hillshade', 'visibility', vis);
      };
      const toggleSkyBtn = document.getElementById('toggleSky');
      if (toggleSkyBtn) toggleSkyBtn.onclick = () => {
        const vis = map.getLayoutProperty('sky', 'visibility') === 'visible' ? 'none' : 'visible';
        map.setLayoutProperty('sky', 'visibility', vis);
      };

      // 初始顯示
      applySearch('');
    });
  </script>
</body>
</html>
