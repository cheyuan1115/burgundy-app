    // 正規化
    function _norm(s=''){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // 去重音
    .replace(/['’`´\.·]/g,'')                         // 去標點
    .replace(/st[\.\s]/g,'saint ')                    // St→Saint
    // 【最終修復】：只將連字號和空格都轉為單一空字串，以匹配最簡潔的 Key
    .replace(/[\-–—]/g,'')                           // 移除連字號
    .replace(/[\s\u00A0\u2000-\u200D]+/g,'')          // 移除所有空白
    .trim();
}
// 原本的：全部變小寫、去重音、去空白和連字號
function _normBase(s=''){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .trim();
}

// 一級園 / GC 用的：全部黏起來，不要破折號、不要空白
function _compactNoHyphen(s=''){
  return _normBase(s)
    .replace(/['’`´\.·]/g,'')
    .replace(/[\-–—\s\u00A0\u2000-\u200D]+/g,'');
}

// 村莊級用的：保留「-」，空白轉成「-」(因為你備份是 aloxe-corton, chambolle-musigny)
function _slugWithHyphen(s=''){
  return _normBase(s)
    .replace(/['’`´\.·]/g,'')
    .replace(/\s+/g, '-')     // 空白變 -
    .replace(/-+/g, '-');     // 多個 - 合成一個
}
function makeAocKeyFromInfo(info){
  // GC：你備份裡就是單一字例如 chambertin，所以拿地塊名或 title 壓成無破折號版
  if (info.level === 'GC') {
    const climat = (info.climats && info.climats[0]) ? info.climats[0] : info.title;
    return _compactNoHyphen(climat);
  }

  // 一級園：你的備份是「地塊_村莊」，兩段都要去掉破折號和空白
  if (info.level === 'PC') {
    const climat = (info.climats && info.climats[0]) ? info.climats[0] : '';
    const village = info.village || '';
    const c = _compactNoHyphen(climat);
    const v = _compactNoHyphen(village);
    return c + '_' + v; // ← 就是你 JSON 那種
  }

  // 村莊級：你的備份是 aloxe-corton, chambolle-musigny → 要保留破折號
  if (info.level === 'VI') {
    return _slugWithHyphen(info.title);
  }

  // 其他就先用 slug
  return _slugWithHyphen(info.title || 'aoc');
}

// index.html (在 openExternalLink 函數之後)
window.drawCellarMarkers = function(summary = {}) {
  if (!window.__MAP_READY__ || !masterAOC) {
    window.__PENDING_CELLAR__ = summary;
    return;
  }

  // 清除舊的
  if (!window.inventoryMarkers) window.inventoryMarkers = [];
  window.inventoryMarkers.forEach(m => m.remove());
  window.inventoryMarkers = [];

  const inv = summary || {};
  const seenKeys = new Set();
  let matched = 0;

  (masterAOC.features || []).forEach(f => {
    const props = f.properties || {};
    const aocKey = props.aoc_key;
    if (!aocKey) return;
    if (seenKeys.has(aocKey)) return;

    const data = inv[aocKey];
    if (!data) return;

    const cellarCount   = Number(data.cellar   || 0);
    const consumedCount = Number(data.consumed || 0);
    if (cellarCount === 0 && consumedCount === 0) return;

    seenKeys.add(aocKey);
    matched++;

    // 取得地塊中心
    const bounds = new maplibregl.LngLatBounds();
    const addCoords = (coords) => {
      if (!coords) return;
      if (Array.isArray(coords) && typeof coords[0] === 'number') bounds.extend(coords);
      else if (Array.isArray(coords)) coords.forEach(addCoords);
    };
    addCoords(f.geometry && f.geometry.coordinates);
    if (bounds.isEmpty()) return;
    const center = bounds.getCenter();

    // 🏁🚩 Emoji 組合邏輯
    let emojiHTML = "";
    if (cellarCount > 0 && consumedCount > 0) {
      // 同時有庫存與已飲
      emojiHTML = `🚩🏁`;
    } else if (cellarCount > 0) {
      emojiHTML = `🚩`;
    } else if (consumedCount > 0) {
      emojiHTML = `🏁`;
    }

    // 🔢 可選：在旗子旁顯示數量（想關掉就註解掉這一行）
    const showNumbers = true; // ← 改成 false 可關閉數字顯示
    if (showNumbers) {
      if (cellarCount > 0 && consumedCount > 0) {
        emojiHTML += `<div style="font-size:10px; color:#222;">${cellarCount}/${consumedCount}</div>`;
      } else if (cellarCount > 0) {
        emojiHTML += `<div style="font-size:10px; color:#222;">${cellarCount}</div>`;
      } else if (consumedCount > 0) {
        emojiHTML += `<div style="font-size:10px; color:#222;">${consumedCount}</div>`;
      }
    }

    // 建立 marker 元素
 const el = document.createElement('div');
el.className = 'cellar-marker';
el.style.background = 'rgba(255, 255, 255, 0.3)';   // ✅ 半透明白底
el.style.border = '0px solid white';                // ✅ 白邊
el.style.borderRadius = '50%';                      // ✅ 圓形
el.style.boxShadow = '0 0 6px rgba(0,0,0,0.4)';     // ✅ 陰影
el.style.width = '32px';
el.style.height = '32px';

el.style.alignItems = 'center';
el.style.justifyContent = 'center';
el.style.backdropFilter = 'blur(2px)';              // ✅ 背景模糊，質感加分
el.innerHTML = `<span style="font-size:30px;">${emojiHTML}</span>`;


    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat(center)
      .setPopup(
        new maplibregl.Popup({ offset: 25 }).setHTML(`
          <strong>${data.aoc_fullname || props.denom || 'AOC'}</strong><br>
          庫存: ${cellarCount} 🍷<br>
          已飲: ${consumedCount} 🥂
        `)
      )
      .addTo(map);

    window.inventoryMarkers.push(marker);
  });

  // 右上角小計
  let dbg = document.getElementById('cellar-debug');

    dbg.style.top = '8px';
    dbg.style.right = '8px';
    dbg.style.zIndex = 9999;
    dbg.style.background = 'rgba(255,255,255,0.85)';
    dbg.style.padding = '4px 8px';
    dbg.style.fontSize = '11px';
    dbg.style.borderRadius = '6px';
    document.body.appendChild(dbg);
  }
  dbg.textContent = `Cellar markers: ${matched}`;
};

function parseAOC(props){
    const raw = String(props?.denom || '');
    const parts = raw.split(',').map(s=>s.trim()).filter(Boolean);
    const partsNorm = parts.map(_norm);

    // 1) Grand Cru
    for (let i=0;i<parts.length;i++){
        const pn = partsNorm[i];
        let gcCanon = GC_ALIASES.get(pn) ?? null;
        if (!gcCanon){
            const idx = GC_NORM.indexOf(pn);
            if (idx !== -1) gcCanon = GC_LIST[idx];
        }
        
        if (gcCanon){
            const home = GC_HOME[gcCanon] || [];
            let climats = [gcCanon];
            
            // *** 【修復 Chablis Grand Cru 關鍵】***
            if (gcCanon === 'Chablis Grand Cru') {
                // 從原始 parts 中，尋找 "Chablis Grand Cru" 後面還有文字的部分
                const climatPartRaw = parts.find(p => p.startsWith('Chablis Grand Cru') && p.length > 'Chablis Grand Cru'.length + 1);
                if (climatPartRaw) {
                    // 例如從 "Chablis Grand Cru Les Clos" 中提取 "Les Clos"
                    const specificClimat = climatPartRaw.replace('Chablis Grand Cru', '').trim();
                    if (specificClimat) {
                        climats = [specificClimat]; // 讓 climats 只包含地塊名 (如 Les Clos)
                        return { level:'GC', title: gcCanon, subtitle: `地點：Chablis / ${specificClimat}`, climats };
                    }
                }
            }
            
            return { level:'GC', title: gcCanon, subtitle: home.length ? `地點：${home.join(' / ')}` : '', climats };
        }
    }

    // 2) Premier Cru
    const pcParts = parts.filter(p => /(premier|1er)\s*cru/i.test(p));
    if (pcParts.length){
        let titleAOC = 'Premier Cru';
        let villagePartRaw = ''; 
        
        // 提取村莊名
        for(const p of pcParts) {
            const m = p.match(/^(.+?)\s+(premier|1er)\s*cru/i);
            if (m && m[1]) {
                villagePartRaw = m[1].trim(); 
                if (villagePartRaw.length > 2 && villagePartRaw.toLowerCase() !== 'bourgogne') {
                   titleAOC = villagePartRaw + ' Premier Cru'; 
                   break;
                }
            }
        }
        
// 提取地塊名稱
        const allClimats = pcParts
          .flatMap(p => {
              // 從 e.g., "Gevrey-Chambertin 1er cru La Bossière" 中提取地塊名
              let tail = p.replace(/^(.+?)\s+(premier|1er)\s*cru/i, '').trim();
              
              // 刪除各種前綴和括號 (這是修復的重點之一)
              tail = tail.replace(/^[\s:\/–—\-]+/, '').replace(/^\((.*)\)$/, '$1').trim();
              
              if (!tail || /premier\s*cru/i.test(tail)) return [];
              
              // *** 保持為單一元素，確保 "La Bossière" 不被切割 ***
              return [tail]; 
          })
          .filter(c => c.length > 2)
          .filter((value, index, self) => self.indexOf(value) === index);

        const title = titleAOC;
        const subtitle = allClimats.length ? `地塊：${allClimats.join(', ')}` : ''; 
        // 備註：此處 join() 仍使用 ', '，但因為 allClimats 只有一個元素，所以不會有逗號
        
        return { level:'PC', title, subtitle, village: villagePartRaw, climats: allClimats };
    }

    // 3) Village
    for (let i=0;i<parts.length;i++){
        const idx = VILL_NORM.indexOf(partsNorm[i]);
        if (idx !== -1){
            return { level:'VI', title: VILLAGES[idx], subtitle:'Village', climats: [] };
        }
    }

    // 4) Régionale / 其他
    return { level:'RE', title: parts[0] || 'AOC', subtitle: 'Régionale / 其他', climats: [] };
}

                ${meta.area_ha ? `<div class="small">面積: <b>${meta.area_ha} ha</b></div>` : ''}
                ${meta.elevation ? `<div class="small">海拔: ${meta.elevation}</div>` : ''}
                ${meta.aspect ? `<div class="small">坡向: ${meta.aspect}</div>` : ''}
                ${meta.soil ? `<div class="small">土壤: ${meta.soil}</div>` : ''}
              </div>
              ${meta.style_note ? `<div class="small" style="color:#2c7d2c;margin-top:6px">風格: ${meta.style_note}</div>` : ''}
              <div class="small" style="color:#555;margin-top:6px">${meta.notes || ''}</div>
              ${ownersHTML} <!-- 插入酒莊列表 -->
              ${meta.link ? `<div class="small" style="margin-top:4px">
              <!-- 修正 Wine-Searcher 連結：改用 openExternalLink 函數 -->
              <a href="javascript:void(0)" onclick="openExternalLink('${meta.link.replace(/'/g, "\\'")}')" rel="noopener noreferrer">🔗 Wine-Searcher</a>
              </div>` : ''}
              </div>
            ` : '';
            
            // 確保 AOC 識別符是唯一的
            const aocTitle = info.title;
            const aocLevel = info.level;
            const climatName = info.climats[0] || '';
            const aoc_key_for_cellar = f.properties.aoc_key || aocTitle; // Fallback 到 aocTitle

            // 【核心修正】：生成狀態文本
            let statusText = '目前狀態：尚無紀錄 🚫🍷';
            if (stockQty > 0) {
                statusText = `目前狀態：庫存 ${stockQty} 瓶 🍷`;
            }
            if (consumedQty > 0) {
                statusText += (stockQty > 0 ? ' / ' : '目前狀態：') + `已飲用 ${consumedQty} 瓶 🥂`;
            }
            const cellarStatusHTML = `<div id="cellar-status-${f.id}" style="font-weight: bold; font-size: 14px; margin-bottom: 8px;">${statusText}</div>`;


            // ************ 填充內容並顯示底部面板 ************
            const finalHTML = `
               <div style="font-weight:700">${info.title}</div>
               <div class="small" style="color:#666;margin-top:6px">等級：${levelText}</div>
               ${subRow}   <!-- 插入地塊/地點名 -->
               ${extra}    <!-- 插入 meta 資料 (如果存在) -->

               <div style="margin-top:10px; border-top: 1px solid #eee; padding-top: 8px;">
                   
                   <!-- 【修正】：直接使用計算好的 statusText -->
                   ${cellarStatusHTML} 

                   <!-- 管理收藏按鈕 (點擊導航到 RN 畫面) -->
                   <button class="btn" style="width: 100%; display: flex; align-items: center; justify-content: center; background: #f0f0f0;"
    onclick="openCellarManager('${aocTitle}', '${aocLevel}', '${climatName}', '${aoc_key_for_cellar}')"> 
    <span style="font-size: 18px; margin-right: 8px;">🍷</span> 管理我的收藏 / 紀錄
</button>
               </div>
            `;
            
            panelContent.innerHTML = finalHTML;
            infoPanel.classList.add('visible');
            
            // 【關鍵移除】：不再需要 setTimeout 呼叫 checkCellarStatus
        });
      // ... (酒莊圖層及搜尋代碼不變) ...
      // 酒莊圖層設定
      const wRes = await fetch(WINERY_DATA_FILE);
      masterWineries = await wRes.json(); // 保存原始數據
      map.addSource('wineries', { type: 'geojson', data: masterWineries });
      
      // 使用 circle 確保穩定顯示
      map.addLayer({
        id: 'wineries',
        type: 'circle',
        source: 'wineries',
        layout: { 'visibility': 'none' }, // 預設為隱藏
        paint: {
          'circle-radius': 4.5,
          'circle-color': '#7b1fa2', // 紫色
          'circle-stroke-width': 1,
          'circle-stroke-color': '#ffffff'
        }
      });
      //限制放大
const ZMAX = 14.5;
map.setMaxZoom(ZMAX);
map.on('move', () => { if (map.getZoom() > ZMAX) map.setZoom(ZMAX); });
//****************

      // ===== 酒莊互動：滑入改游標、點擊顯示 popup（含 meta 合併） =====
      map.on('mouseenter', 'wineries', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'wineries', () => { map.getCanvas().style.cursor = ''; });

      map.on('click', 'wineries', (e) => {
        // ************ 這裡仍保留 Pop-up 給酒莊，因為資訊較簡短 ************
        const f = e.features && e.features[0];
        if (!f) return;
        const p = f.properties || {};

        const key =
          (p.id && String(p.id)) ||
          (p.place_id && String(p.place_id)) ||
          _norm(p.name || '');

        const m =
          (META.wineries && (META.wineries[key] || META.wineries[_norm(p.name || '')])) ||
          null;

        const name  = (m && (m.display_name || m.name)) || p.name || 'Winery';
        const addr  = (m && m.address)  || p.address  || '';
        const phone = (m && m.phone)    || p.phone    || '';
        const site  = (m && m.website)  || p.website  || '';
        const note  = (m && (m.note || m.notes)) || '';

        const html = `
          <div style="min-width:240px">
            <div style="font-weight:700">${name}</div>
            ${addr  ? `<div class="small" style="color:#555">${addr}</div>` : ''}
            ${phone ? `<div class="small" style="color:#555">☎ ${phone}</div>` : ''}
            ${site  ? `<div class="small"><a href="${site}" target="_blank" rel="noopener">網站</a></div>` : ''}
            ${note  ? `<div class="small" style="color:#555;margin-top:6px">${note}</div>` : ''}
          </div>
        `;

        new maplibregl.Popup({ closeOnClick: true })
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
        // *******************************************************************
      });


      // ====== AOC 搜尋（直接對 masterAOC 篩選後 setData）======
      async function applySearch(qRaw){
        currentFilterQ = _norm(qRaw || ''); 
        const feats = (masterAOC.features || []).filter(f => {
          if (!currentFilterQ) return true;
          const denom = f.properties?.denom || '';
          const names = denom.split(',').map(s => s.trim()).filter(Boolean);
          const score = Math.max(...names.map(n => {
            const nn = _norm(n);
            if (nn === currentFilterQ) return 100;
            if (nn.startsWith(currentFilterQ)) return 50;
            if (nn.includes(currentFilterQ)) return 10;
            return 0;
          }));
          return score > 0;
        });

        const filtered = {
  type: 'FeatureCollection',
  features: feats.map(f => {
    const p = f.properties || {};
    const info = parseAOC(p);
    return {
      ...f,
      properties: {
        ...p,
        lvl: info.level,
        aoc_key: makeAocKeyFromInfo(info)  // ←補回來
      }
    };
  })
};

        map.getSource('aoc').setData(filtered);

        if (feats.length) {
          const b = new maplibregl.LngLatBounds();
          
          const addCoords = (coords) => {
            if (Array.isArray(coords) && coords.length >= 2 && typeof coords[0] === 'number') {
              b.extend(coords);
            } else if (Array.isArray(coords)) {
              coords.forEach(addCoords);
            }
          };

          feats.forEach(f => {
            const geom = f.geometry;
            if (geom && geom.coordinates) {
               addCoords(geom.coordinates);
            }
          });
          
          if (b.isEmpty()) {
              console.warn("AOC 搜尋：計算出的邊界框為空。");
              return;
          }
          
          map.fitBounds(b, { padding: 40, maxzoom: 15, duration: 600 });
        }
      }
      
      // ************ 酒莊搜尋邏輯：通過程式碼過濾然後更新 Source Data ************
      function applyWinerySearch(qRaw){
        const qNorm = _norm(qRaw || ''); 
        
        if (!map.getSource('wineries')) return;

        if (!qNorm) {
            // 清空搜尋：顯示所有酒莊
            map.getSource('wineries').setData(masterWineries);
            return;
        }
        
        // 程式碼過濾 (忽略大小寫/重音)
        const filteredWineries = masterWineries.features.filter(f => {
          const name = _norm(f.properties?.name || '');
          // 可以在這裡加入更多屬性來搜尋，例如 address
          const combined = `${name} ${_norm(f.properties?.address || '')}`; 
          return combined.includes(qNorm);
        });
        
        map.getSource('wineries').setData({ type: 'FeatureCollection', features: filteredWineries });
        
        // 找到並飛向第一個結果
        if (filteredWineries.length > 0) {
            const firstFeature = filteredWineries[0];
            const coords = firstFeature.geometry.coordinates;
            if (coords && coords.length === 2 && typeof coords[0] === 'number') {
                map.flyTo({ center: coords, zoom: Math.min(Math.max(map.getZoom(), 12), 14.5), duration: 600 });
            }
        }
      }
      // ****************************************


      // 綁定 UI
      const q = document.getElementById('q');
      const btnAll = document.getElementById('showAll');
      const btnWineries = document.getElementById('toggleWineries');
      
      const wineryQ = document.getElementById('winery-q'); 
      const btnClearWinery = document.getElementById('clear-winery'); 
      const wineryContainer = document.getElementById('winery-search-container');
      const goHomeBtn = document.getElementById('goHomeBtn'); // 【新增】獲取按鈕
      
      
      let tAOC = null;
      q.addEventListener('input', ()=>{ clearTimeout(tAOC); tAOC = setTimeout(()=> applySearch(q.value), 220); });
      btnAll.onclick   = ()=> { q.value=''; applySearch(''); };
      
      // 🍷 綁定回主選單按鈕
      goHomeBtn.onclick = goBackToHome;
      
      // 🍷 酒莊顯示功能實作 - 使用圖示切換
      btnWineries.onclick = () => {
        const currentVis = map.getLayoutProperty('wineries', 'visibility') === 'visible';
        const newVis = currentVis ? 'none' : 'visible';
        
        map.setLayoutProperty('wineries', 'visibility', newVis);
        
        if (newVis === 'visible') {
            // 顯示酒莊圖層時
            btnWineries.textContent = '🍷';
            btnWineries.title = '隱藏酒莊';
            // 顯示搜尋欄
            wineryContainer.style.display = 'block'; 
        } else {
            // 隱藏酒莊圖層時
            btnWineries.textContent = '🚫🍷'; 
            btnWineries.title = '顯示酒莊';
            // 隱藏搜尋欄並清空篩選
            wineryContainer.style.display = 'none'; 
            wineryQ.value = ''; // 清空搜尋欄位
            applyWinerySearch(''); // 清空篩選結果，顯示所有原始酒莊 (但圖層本身是隱藏的)
        }
        wineriesVisible = !currentVis;
      };

      // 綁定酒莊搜尋 UI
      let tWinery = null;
      wineryQ.addEventListener('input', ()=>{ clearTimeout(tWinery); tWinery = setTimeout(()=> applyWinerySearch(wineryQ.value), 220); });
      
      btnClearWinery.onclick = ()=> { 
        wineryQ.value = ''; 
        applyWinerySearch('');
        // 確保酒莊圖層在清除搜尋後是可見的 (如果它被打開了的話)
        if (map.getLayoutProperty('wineries', 'visibility') !== 'visible') {
            map.setLayoutProperty('wineries', 'visibility', 'visible');
            btnWineries.textContent = '🍷';
            btnWineries.title = '隱藏酒莊';
        }
      };
            // ************ 確保掃描按鈕綁定存在 ************
    
        
        // 注意：如果您保留了原來的 btnScanner.onclick = ... 則需要刪除它
        // 因為 addEventListener 已經完成了綁定
    
// ****************************************
      // ****************************************
      // 視角控制程式碼 (為保持完整性保留)
      const pitchEl = document.getElementById('pitch');
      const pitchVal = document.getElementById('pitchVal');
      if (pitchEl) pitchEl.oninput = () => {
        const v = Number(pitchEl.value)||0;
        map.setPitch(v);
        pitchVal.textContent = v + '°';
      };

      const bearingEl = document.getElementById('bearing');
      const bearingVal = document.getElementById('bearingVal');
      if (bearingEl) bearingEl.oninput = () => {
        const v = Number(bearingEl.value)||0;
        map.setBearing(v);
        bearingVal.textContent = v + '°';
      };

      const exgEl = document.getElementById('exg');
      const exgVal = document.getElementById('exgVal');
      if (exgEl) exgEl.oninput = () => {
        const v = (Number(exgEl.value)||150) / 100; // 100% => 1.0
        exgVal.textContent = (v*100).toFixed(0) + '%';
        const style = map.getStyle();
        if (style && style.terrain) {
          map.setTerrain({ source: 'terrain-dem', exaggeration: v });
        }
      };

      const resetBtn = document.getElementById('resetView');
      if (resetBtn) resetBtn.onclick = () => {
        map.flyTo({ center:[START.lng, START.lat], zoom: START.zoom, pitch: START.pitch, bearing: START.bearing, duration: 700 });
        if (pitchEl) pitchEl.value = START.pitch; if (pitchVal) pitchVal.textContent = START.pitch + '°';
        if (bearingEl) bearingEl.value = START.bearing; if (bearingVal) bearingVal.textContent = START.bearing + '°';
        if (exgEl) exgEl.value = 150; if (exgVal) exgVal.textContent = '150%';
        const style = map.getStyle(); if (style && style.terrain) map.setTerrain({ source: 'terrain-dem', exaggeration: 3.0 });
      };

      // Hillshade / Sky 開關
      const toggleShadeBtn = document.getElementById('toggleShade');
      if (toggleShadeBtn) toggleShadeBtn.onclick = () => {
        const vis = map.getLayoutProperty('hillshade', 'visibility') === 'visible' ? 'none' : 'visible';
        map.setLayoutProperty('hillshade', 'visibility', vis);
      };
      const toggleSkyBtn = document.getElementById('toggleSky');
      if (toggleSkyBtn) toggleSkyBtn.onclick = () => {
        const vis = map.getLayoutProperty('sky', 'visibility') === 'visible' ? 'none' : 'visible';
        map.setLayoutProperty('sky', 'visibility', vis);
      };


            if (window.CELLAR_DATA_TO_DRAW) {
          // 確保 drawCellarMarkers 函式已被定義
          if (typeof window.drawCellarMarkers === 'function') {
             window.drawCellarMarkers(window.CELLAR_DATA_TO_DRAW);
             // 清除全局變量，避免重複繪製
             delete window.CELLAR_DATA_TO_DRAW; 
          } else {
             console.error("drawCellarMarkers 尚未定義，無法繪製地窖標記。");
          }
      }
      window.__MAP_READY__ = true;

// 如果之前有人先塞了庫存進來，就現在畫
if (window.__PENDING_CELLAR__) {
  window.drawCellarMarkers(window.__PENDING_CELLAR__);
  window.__PENDING_CELLAR__ = null;
}
      // 初始顯示
    //  applySearch('');
    });


  </script>
