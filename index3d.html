<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Burgundy AOC — 3D 可傾斜版（MapLibre GL）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .ui{
      position: absolute; z-index: 10; top: 12px; left: 12px;
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      width: min(88vw, 560px); font: 14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .ui input[type="text"]{ flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font:inherit; }
    .btn{ padding:6px 10px; border:1px solid #ddd; border-radius:8px; background:#f8f8f8; cursor:pointer; font:12px; white-space:nowrap; }
    .btn:hover{ background:#eee; }
    label.small{ font-size:12px; color:#666; }
    .legend{
      position:absolute; z-index:10; right:12px; bottom:12px; background:#fff; padding:10px;
      border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.18); font:13px system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .legend .item{ display:flex; align-items:center; gap:8px; margin:4px 0; }
    .swatch{ width:16px; height:12px; border:2px solid #000; border-radius:3px }
    .gc{ border-color:#cc0033; background:#cc003322 }
    .pc{ border-color:#ff7f0e; background:#ff7f0e33 }
    .vi{ border-color:#1f77b4; background:#1f77b433 }
    .re{ border-color:#2ca02c; background:#2ca02c33 }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="ui">
    <div class="row"><b>篩選 AOC 名稱（含 Grand/Premier/Village/Regional 著色）</b></div>
    <div class="row">
      <input id="q" type="text" placeholder="例如：Meursault / La Romanee">
      <button class="btn" id="clear">清除</button>
      <button class="btn" id="showAll">全部</button>
    </div>

    <div class="row">
      <label class="small">傾斜 Pitch</label>
      <input id="pitch" type="range" min="0" max="70" value="45" style="flex:1">
      <span id="pitchVal" class="small">45°</span>
    </div>
    <div class="row">
      <label class="small">朝向 Bearing</label>
      <input id="bearing" type="range" min="-180" max="180" value="0" style="flex:1">
      <span id="bearingVal" class="small">0°</span>
      <button class="btn" id="resetView">重置視角</button>
    </div>
    <div class="row">
      <label class="small">地形誇張度</label>
      <input id="exg" type="range" min="50" max="300" value="150" style="flex:1">
      <span id="exgVal" class="small">150%</span>
      <button class="btn" id="toggleShade">Hillshade 開/關</button>
      <button class="btn" id="toggleSky">Sky 開/關</button>
    </div>
  </div>

  <div class="legend">
    <div class="item"><span class="swatch gc"></span> Grand Cru</div>
    <div class="item"><span class="swatch pc"></span> Premier Cru</div>
    <div class="item"><span class="swatch vi"></span> Village</div>
    <div class="item"><span class="swatch re"></span> Régionale / 其他</div>
  </div>

  <script>
    // ====== 設定 ======
    const AOC_DATA_FILE = './burgundy.geojson';
    const WINERY_DATA_FILE = './wineries.geojson';
    const START = { lng: 4.80, lat: 47.00, zoom: 8.8, pitch: 45, bearing: 0 };

    // ====== Map 初始化（MapLibre GL）======
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          // 基礎底圖：OSM Raster（免金鑰）
          'osm': {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            maxzoom: 19,
            attribution: '© OpenStreetMap contributors'
          },
          // DEM：Terrarium（免金鑰）
          'terrain-dem': {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 15,
            encoding: 'terrarium' // 關鍵：Terrarium 編碼
          }
        },
        layers: [
          { id: 'osm', type: 'raster', source: 'osm' }
        ],
        // 直接在 style 裡啟用地形（會被之後的 slider 覆蓋）
        terrain: { source: 'terrain-dem', exaggeration: 1.5 }
      },
      center: [START.lng, START.lat],
      zoom: START.zoom,
      pitch: START.pitch,
      bearing: START.bearing,
      antialias: true,
      hash: false
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // ====== 名稱正規化 & 分級判定（沿用你的邏輯）======
    function norm(s=''){ return s.toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'').replace(/['’·.`´]+/g,'')
      .replace(/[-\s\u00A0\u2000-\u200D\u2010-\u2015]+/g,'').trim(); }

    const GRAND_CRU = ["Chambertin","Chambertin-Clos de Bèze","Mazis-Chambertin","Charmes-Chambertin","Griotte-Chambertin","Latricières-Chambertin","Ruchottes-Chambertin","Mazoyères-Chambertin","Clos de la Roche","Clos Saint-Denis","Clos des Lambrays","Clos de Tart","Bonnes-Mares","Musigny","Clos de Vougeot","Échezeaux","Grands Échezeaux","Richebourg","Romanée-Conti","La Romanée","Romanée-Saint-Vivant","La Tâche","La Grande Rue","Corton","Corton-Charlemagne","Charlemagne","Montrachet","Bâtard-Montrachet","Chevalier-Montrachet","Criots-Bâtard-Montrachet","Bienvenues-Bâtard-Montrachet","Chablis Grand Cru"];
    const GRAND_CRU_NORM = GRAND_CRU.map(n => norm(n));

    const VILLAGES = ["Chablis","Marsannay","Fixin","Gevrey-Chambertin","Morey-Saint-Denis","Chambolle-Musigny","Vougeot","Flagey-Échezeaux","Vosne-Romanée","Nuits-Saint-Georges","Côte de Nuits-Villages","Ladoix","Aloxe-Corton","Pernand-Vergelesses","Chorey-lès-Beaune","Savigny-lès-Beaune","Beaune","Pommard","Volnay","Monthelie","Auxey-Duresses","Saint-Romain","Meursault","Blagny","Puligny-Montrachet","Chassagne-Montrachet","Saint-Aubin","Santenay","Maranges","Côte de Beaune-Villages","Bouzeron","Rully","Mercurey","Givry","Montagny","Pouilly-Fuissé","Pouilly-Loché","Pouilly-Vinzelles","Saint-Véran","Viré-Clessé","Mâcon","Saint-Amour","Juliénas","Chénas"];
    const VILLAGES_NORM = VILLAGES.map(n => norm(n));

    function classify(props){
      const denom = (props?.denom || '').toLowerCase();
      if (denom.includes('clos de vougeot')) return 'GC';
      const names = (props?.denom || '').split(',').map(s=>s.trim()).filter(Boolean);
      const namesN = names.map(norm);
      if (namesN.some(n => GRAND_CRU_NORM.includes(n))) return 'GC';
      if (names.some(n => n.toLowerCase().includes('grand cru'))) return 'GC';
      if (names.some(n => n.toLowerCase().includes('premier cru'))) return 'PC';
      if (namesN.some(n => VILLAGES_NORM.includes(n))) return 'VI';
      return 'RE';
    }

    // ====== 載入資料並建立圖層 ======
    let masterAOC = null; // 完整 AOC FC
    let currentFilterQ = ''; // 搜尋字串（正規化）

    map.on('load', async () => {
      // Sky + Hillshade
      map.addLayer({
        id: 'sky',
        type: 'sky',
        paint: {
          'sky-type': 'atmosphere',
          'sky-atmosphere-sun': [0.0, 0.0],
          'sky-atmosphere-sun-intensity': 12
        }
      });

      map.addLayer({
        id: 'hillshade',
        type: 'hillshade',
        source: 'terrain-dem',
        layout: { visibility: 'visible' },
        paint: {
          'hillshade-exaggeration': 0.5,
          'hillshade-shadow-color': 'rgba(0,0,0,0.55)',
          'hillshade-illumination-direction': 315
        }
      });

      // AOC
      const aocRes = await fetch(AOC_DATA_FILE);
      masterAOC = await aocRes.json();

      // 動態加上 level（lvl）屬性，方便 style 選色
      const enrich = (fc) => ({
        type: 'FeatureCollection',
        features: (fc.features || []).map(f => {
          const p = f.properties || {};
          const lvl = classify(p);
          return { ...f, properties: { ...p, lvl } };
        })
      });

      // 建立 GeoJSON source（可之後 setData）
      map.addSource('aoc', { type: 'geojson', data: enrich(masterAOC), promoteId: 'id', generateId: true });

      // Fill 著色
      map.addLayer({
        id: 'aoc-fill',
        type: 'fill',
        source: 'aoc',
        paint: {
          'fill-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            /* 其他（RE）*/ '#2ca02c'
          ],
          'fill-opacity': [
            'match', ['get', 'lvl'],
            'GC', 0.18,
            'PC', 0.16,
            'VI', 0.14,
            /* RE */   0.12
          ]
        }
      });

      // 邊線
      map.addLayer({
        id: 'aoc-line',
        type: 'line',
        source: 'aoc',
        paint: {
          'line-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            /* RE */ '#2ca02c'
          ],
          'line-width': 1.2
        }
      });

      // Hover 高亮（用 feature-state）
      map.addLayer({
        id: 'aoc-line-hl',
        type: 'line',
        source: 'aoc',
        paint: {
          'line-color': [
            'match', ['get', 'lvl'],
            'GC', '#cc0033',
            'PC', '#ff7f0e',
            'VI', '#1f77b4',
            '#2ca02c'
          ],
          'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2.4, 0]
        }
      });

      let hoveredId = null;
      map.on('mousemove', 'aoc-fill', (e) => {
        if (!e.features?.length) return;
        const f = e.features[0];
        if (hoveredId !== null) map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: false });
        hoveredId = f.id;
        map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: true });
      });
      map.on('mouseleave', 'aoc-fill', () => {
        if (hoveredId !== null) map.setFeatureState({ source: 'aoc', id: hoveredId }, { hover: false });
        hoveredId = null;
      });
// ---- 主函式：解析 props.denom，傳回 {level, title, subtitle} ----
function parseAOC(props) {
  const denom = String(props?.denom || '');
  const parts = denom.split(',').map(s => s.trim()).filter(Boolean);
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’·.`´]/g, '').trim();

  const GRAND_CRU = [
    "Chambertin","Chambertin-Clos de Bèze","Mazis-Chambertin","Charmes-Chambertin","Griotte-Chambertin","Latricières-Chambertin","Ruchottes-Chambertin","Mazoyères-Chambertin",
    "Clos de la Roche","Clos Saint-Denis","Clos des Lambrays","Clos de Tart","Bonnes-Mares","Musigny","Clos de Vougeot",
    "Échezeaux","Grands Échezeaux","Richebourg","Romanée-Conti","La Romanée","Romanée-Saint-Vivant","La Tâche","La Grande Rue",
    "Corton","Corton-Charlemagne","Charlemagne",
    "Montrachet","Bâtard-Montrachet","Chevalier-Montrachet","Criots-Bâtard-Montrachet","Bienvenues-Bâtard-Montrachet",
    "Chablis Grand Cru"
  ];
  const GC_VILLAGES = {
    "Chambertin":["Gevrey-Chambertin"],
    "Chambertin-Clos de Bèze":["Gevrey-Chambertin"],
    "Clos de Vougeot":["Vougeot"],
    "Richebourg":["Vosne-Romanée"],
    "Romanée-Conti":["Vosne-Romanée"],
    "Montrachet":["Puligny-Montrachet","Chassagne-Montrachet"],
    "Corton":["Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"],
    "Chablis Grand Cru":["Chablis"]
  };

  const VILLAGES = [
    "Chablis","Marsannay","Fixin","Gevrey-Chambertin","Morey-Saint-Denis","Chambolle-Musigny","Vougeot",
    "Vosne-Romanée","Nuits-Saint-Georges","Beaune","Pommard","Volnay","Meursault","Puligny-Montrachet","Chassagne-Montrachet"
  ];
  const normSet = list => list.map(norm);

  const GC_N = normSet(GRAND_CRU);
  const VILL_N = normSet(VILLAGES);
  const allText = norm(denom);

  // ---- 1) Grand Cru ----
  for (let i=0; i<GC_N.length; i++) {
    if (allText.includes(GC_N[i])) {
      const gc = GRAND_CRU[i];
      const villages = GC_VILLAGES[gc] || [];
      return {
        level: 'GC',
        title: gc,
        subtitle: villages.length ? `地點：${villages.join(' / ')}` : ''
      };
    }
  }

  // ---- 2) Premier Cru ----
    // ---- 2) Premier Cru：找含 "premier cru" / "1er cru" 的片段
  //   標題 = 氣候名（若有），副標 = "<村名> Premier Cru"
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const pn = partsNorm[i];
    const hasPC = /(premier|1er)\s*cru/i.test(p);
    if (!hasPC) continue;

    // 嘗試從所有片段找村名（完全相等）
    let village = '';
    for (let j = 0; j < parts.length; j++) {
      if (VILL_NORM.includes(partsNorm[j])) { village = parts[j]; break; }
    }
    // 若找不到，嘗試從同一片段開頭抓村名（ex: "Chambolle-Musigny premier cru Les Gruenchers"）
    if (!village) {
      for (const v of VILLAGES) {
        const vn = _norm(v);
        if (pn.startsWith(vn + ' ')) { village = v; break; }
      }
    }

    // 1) 先抓「premier cru 之後」的內容（支援 : / - – 等）
    //    例："... premier cru Les Gruenchers"、"... premier cru - Les Amoureuses"
    let climat = '';
    const m =
      p.match(/(?:premier|1er)\s*cru\s*(?:[:\/\-–]\s*|\s+)(.+)$/i) ||
      p.match(/(?:premier|1er)\s*cru\s*(.+)$/i);
    if (m && m[1]) climat = m[1].trim();

    // 2) 去除多餘括號、前後標點
    climat = climat.replace(/^[\s–—-:\/]+/, '').replace(/\s+$/, '');
    climat = climat.replace(/^\((.*)\)$/, '$1').trim();

    // 3) 若 climat 看起來只是重覆 "Village Premier Cru"（沒有真正地塊名）就視為空
    const pcGeneric = village ? new RegExp('^' + _norm(village) + '\\s+premier\\s*cru$', 'i') : null;
    if (climat && pcGeneric && pcGeneric.test(_norm(climat))) climat = '';

    if (climat) {
      // 例：Aux Boudots / Les Gruenchers …
      return {
        level: 'PC',
        title: climat,
        subtitle: village ? `${village} Premier Cru` : 'Premier Cru'
      };
    } else {
      // 沒有具名氣候，就直接顯示「<村名> Premier Cru」或原片段
      const title = village ? `${village} Premier Cru` : p.replace(/\s+/g, ' ').trim();
      return { level: 'PC', title, subtitle: '' };
    }
  }


  // ---- 3) Village ----
  for (let i=0; i<VILL_N.length; i++) {
    if (allText.includes(VILL_N[i])) {
      return { level: 'VI', title: VILLAGES[i], subtitle: 'Village' };
    }
  }

  // ---- 4) Regional ----
  return { level: 'RE', title: parts[0] || 'AOC', subtitle: 'Régionale / 其他' };
}

      // 點擊 popup

// 正規化
function _norm(s=''){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/['’`´\.·]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

// Grand Cru 名單（正名）
const GC_LIST = [
  "Chambertin","Chambertin-Clos de Bèze","Mazis-Chambertin","Charmes-Chambertin","Griotte-Chambertin","Latricières-Chambertin","Ruchottes-Chambertin","Mazoyères-Chambertin",
  "Clos de la Roche","Clos Saint-Denis","Clos des Lambrays","Clos de Tart","Bonnes-Mares","Musigny","Clos de Vougeot",
  "Échezeaux","Grands Échezeaux","Richebourg","Romanée-Conti","La Romanée","Romanée-Saint-Vivant","La Tâche","La Grande Rue",
  "Corton","Corton-Charlemagne","Charlemagne",
  "Montrachet","Bâtard-Montrachet","Chevalier-Montrachet","Criots-Bâtard-Montrachet","Bienvenues-Bâtard-Montrachet",
  "Chablis Grand Cru"
];
const GC_NORM = GC_LIST.map(_norm);

// 必要別名 → 對應的 GC 正名（用來完全比對，而不是 contains）
const GC_ALIASES = new Map([
  [_norm("Clos Vougeot"), "Clos de Vougeot"],
  [_norm("Clos de Vougeot ou Clos Vougeot"), "Clos de Vougeot"],
]);

// GC 所屬村莊（副標）
const GC_HOME = {
  "Chambertin": ["Gevrey-Chambertin"],
  "Chambertin-Clos de Bèze": ["Gevrey-Chambertin"],
  "Clos de Vougeot": ["Vougeot"],
  "Richebourg": ["Vosne-Romanée"],
  "Romanée-Conti": ["Vosne-Romanée"],
  "Montrachet": ["Puligny-Montrachet","Chassagne-Montrachet"],
  "Corton": ["Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"],
  "Chablis Grand Cru": ["Chablis"]
};

// 村莊級（完全比對）
const VILLAGES = [
  "Chablis","Marsannay","Fixin","Gevrey-Chambertin","Morey-Saint-Denis","Chambolle-Musigny","Vougeot",
  "Vosne-Romanée","Nuits-Saint-Georges","Beaune","Pommard","Volnay","Meursault",
  "Puligny-Montrachet","Chassagne-Montrachet","Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"
];
const VILL_NORM = VILLAGES.map(_norm);

// 解析一個 feature 的 props，回傳 {level:'GC|PC|VI|RE', title, subtitle}
function parseAOC(props){
  const raw = String(props?.denom || '');
  const parts = raw.split(',').map(s=>s.trim()).filter(Boolean);

  // 先做一個「完全相等」的查表（避免 Musigny / Chambertin 誤判）
  const partsNorm = parts.map(_norm);

  // 1) Grand Cru：只接受「完全相等」或在 GC_ALIASES 中
  for (let i=0;i<parts.length;i++){
    const pn = partsNorm[i];
    let gcCanon = null;
    const aliasHit = GC_ALIASES.get(pn);
    if (aliasHit) gcCanon = aliasHit;
    else {
      const idx = GC_NORM.indexOf(pn);
      if (idx !== -1) gcCanon = GC_LIST[idx];
    }
    if (gcCanon){
      const home = GC_HOME[gcCanon] || [];
      return {
        level:'GC',
        title: gcCanon,
        subtitle: home.length ? `地點：${home.join(' / ')}` : ''
      };
    }
  }

  // 2) Premier Cru：找含 "premier cru" / "1er cru" 的片段
  //   標題 = 氣候名（若有），副標 = "<村名> Premier Cru"
  for (let i=0;i<parts.length;i++){
    const p = parts[i];
    const hasPC = /(premier|1er)\s*cru/i.test(p);
    if (!hasPC) continue;

    // 嘗試從整體 parts 找村名（完全相等）
    let village = '';
    for (let j=0;j<parts.length;j++){
      if (VILL_NORM.includes(partsNorm[j])) { village = parts[j]; break; }
    }
    // 若找不到，嘗試從同一片段開頭抓村名（ex: "Nuits-Saint-Georges premier cru Aux Boudots"）
    if (!village){
      for (let v of VILLAGES){
        const vn = _norm(v);
        if (partsNorm[i].startsWith(vn+' ')){ village = v; break; }
      }
    }

    // 擷取 climat（在 "premier cru" 後面的東西）
    let climat = '';
    const m = p.match(/(?:premier|1er)\s*cru\s*(.*)$/i);
    if (m && m[1]) climat = m[1].trim().replace(/^[-–:]\s*/,'').trim();

    if (climat){
      return { level:'PC', title: climat, subtitle: village ? `${village} Premier Cru` : 'Premier Cru' };
    } else {
      // 沒有具名氣候，就直接顯示「<村名> Premier Cru」或原片段
      const title = village ? `${village} Premier Cru` : p.replace(/\s+/g,' ').trim();
      return { level:'PC', title, subtitle: '' };
    }
  }

  // 3) Village：完全相等
  for (let i=0;i<parts.length;i++){
    const idx = VILL_NORM.indexOf(partsNorm[i]);
    if (idx !== -1){
      return { level:'VI', title: VILLAGES[idx], subtitle:'Village' };
    }
  }

  // 4) Régionale / 其他：優先回傳第一個片段（通常是 Bourgogne…）
  return { level:'RE', title: parts[0] || 'AOC', subtitle: 'Régionale / 其他' };
}




      
     // --- 點擊顯示彈窗（改成正確命名版本）---
map.on('click', 'aoc-fill', (e) => {
  const f = e.features && e.features[0];
  if (!f) return;

  const info = parseAOC(f.properties || {});
  const levelText = { GC:'Grand Cru', PC:'Premier Cru', VI:'Village', RE:'Régionale / 其他' }[info.level] || 'AOC';
  const sub = info.subtitle ? `（${info.subtitle}）` : '';

  new maplibregl.Popup({ closeOnClick: true })
    .setLngLat(e.lngLat)
    .setHTML(
      `<div style="min-width:260px">
         <div style="font-weight:700">${info.title}</div>
         <div class="small" style="color:#666;margin-top:6px">等級：${levelText} ${sub}</div>
       </div>`
    )
    .addTo(map);
});


      // 酒莊：用 🍷 符號（也可換自訂 icon）
      const wRes = await fetch(WINERY_DATA_FILE);
      const wFC = await wRes.json();
      map.addSource('wineries', { type: 'geojson', data: wFC });
      map.addLayer({
        id: 'wineries',
        type: 'symbol',
        source: 'wineries',
        layout: {
          'text-field': '🍷',
          'text-size': 16,
          'text-offset': [0, -0.2],
          'text-allow-overlap': true
        }
      });

      map.on('click', 'wineries', (e) => {
        const f = e.features?.[0]; if (!f) return;
        const p = f.properties || {};
        let html = `<b>${p.name || 'Winery'}</b>`;
        if (p.address) html += `<br>📍 ${p.address}`;
        if (p.phone)   html += `<br>☎️ ${p.phone}`;
        if (p.website) html += `<br>🌐 <a href="${p.website}" target="_blank">官方網站</a>`;
        new maplibregl.Popup({ closeOnClick: true })
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      });

      // ====== 搜尋（直接對 masterAOC 篩選後 setData）======
      async function applySearch(qRaw){
        currentFilterQ = norm(qRaw || '');
        const feats = (masterAOC.features || []).filter(f => {
          if (!currentFilterQ) return true;
          const denom = f.properties?.denom || '';
          const names = denom.split(',').map(s => s.trim()).filter(Boolean);
          const score = Math.max(...names.map(n => {
            const nn = norm(n);
            if (nn === currentFilterQ) return 100;
            if (nn.startsWith(currentFilterQ)) return 50;
            if (nn.includes(currentFilterQ)) return 10;
            return 0;
          }));
          return score > 0;
        });

        const filtered = { type:'FeatureCollection', features: feats.map(f => {
          const p = f.properties || {};
          return { ...f, properties: { ...p, lvl: classify(p) } };
        })};

        map.getSource('aoc').setData(filtered);

        // 自動 zoom 到結果
        if (feats.length) {
          // 計算 bounds
          const b = new maplibregl.LngLatBounds();
          feats.forEach(f => {
            const add = (coords) => {
              if (typeof coords[0] === 'number') b.extend([coords[0], coords[1]]);
              else coords.forEach(add);
            };
            add(f.geometry.coordinates);
          });
          map.fitBounds(b, { padding: 20, maxZoom: 14, duration: 600, pitch: map.getPitch(), bearing: map.getBearing() });
        }
      }

      // 綁定 UI
      const q = document.getElementById('q');
      const btnClear = document.getElementById('clear');
      const btnAll = document.getElementById('showAll');
      let t = null;
      q.addEventListener('input', ()=>{ clearTimeout(t); t = setTimeout(()=> applySearch(q.value), 220); });
      btnClear.onclick = ()=> { q.value=''; applySearch(''); };
      btnAll.onclick   = ()=> { q.value=''; applySearch(''); };

      // 初始顯示
      applySearch('');
    });

    // ====== 視角 & 地形誇張度 控制 ======
    const pitchEl = document.getElementById('pitch');
    const pitchVal = document.getElementById('pitchVal');
    pitchEl.oninput = () => {
      const v = Number(pitchEl.value)||0;
      map.setPitch(v);
      pitchVal.textContent = v + '°';
    };

    const bearingEl = document.getElementById('bearing');
    const bearingVal = document.getElementById('bearingVal');
    bearingEl.oninput = () => {
      const v = Number(bearingEl.value)||0;
      map.setBearing(v);
      bearingVal.textContent = v + '°';
    };

    const exgEl = document.getElementById('exg');
    const exgVal = document.getElementById('exgVal');
    exgEl.oninput = () => {
      const v = (Number(exgEl.value)||150) / 100; // 100% => 1.0
      exgVal.textContent = (v*100).toFixed(0) + '%';
      // 更新地形誇張度
      const style = map.getStyle();
      if (style && style.terrain) {
        map.setTerrain({ source: 'terrain-dem', exaggeration: v });
      }
    };

    document.getElementById('resetView').onclick = () => {
      map.flyTo({ center:[START.lng, START.lat], zoom: START.zoom, pitch: START.pitch, bearing: START.bearing, duration: 700 });
      pitchEl.value = START.pitch; pitchVal.textContent = START.pitch + '°';
      bearingEl.value = START.bearing; bearingVal.textContent = START.bearing + '°';
      exgEl.value = 150; exgVal.textContent = '150%';
      const style = map.getStyle(); if (style && style.terrain) map.setTerrain({ source: 'terrain-dem', exaggeration: 1.5 });
    };

    // Hillshade / Sky 開關
    document.getElementById('toggleShade').onclick = () => {
      const vis = map.getLayoutProperty('hillshade', 'visibility') === 'visible' ? 'none' : 'visible';
      map.setLayoutProperty('hillshade', 'visibility', vis);
    };
    document.getElementById('toggleSky').onclick = () => {
      const vis = map.getLayoutProperty('sky', 'visibility') === 'visible' ? 'none' : 'visible';
      map.setLayoutProperty('sky', 'visibility', vis);
    };
  </script>
</body>
</html>
