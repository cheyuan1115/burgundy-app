<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Burgundy AOC 3D（完整版 / 正確彈窗命名）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.7.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.7.2/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .ui {
      position: absolute; z-index: 1000; top: 12px; left: 12px;
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      width: min(88vw, 520px);
      font: 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .ui input[type="text"]{ flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font:inherit; }
    .btn{ padding:6px 10px; border:1px solid #ddd; border-radius:8px; background:#f8f8f8; cursor:pointer; font:12px; white-space:nowrap }
    .btn:hover{ background:#eee }
    .small{ font-size:12px; color:#666 }
    .legend {
      position:absolute; z-index:1000; right:12px; bottom:12px; background:#fff; padding:10px;
      border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.18);
      font:13px system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial
    }
    .legend .item{ display:flex; align-items:center; gap:8px; margin:4px 0 }
    .swatch{ width:16px; height:12px; border:2px solid #000; border-radius:3px }
    .swatch.gc{ border-color:#cc0033; background:#cc003322 }
    .swatch.pc{ border-color:#ff7f0e; background:#ff7f0e33 }
    .swatch.vi{ border-color:#1f77b4; background:#1f77b433 }
    .swatch.re{ border-color:#2ca02c; background:#2ca02c33 }
    .toggle { display:flex; gap:10px; align-items:center; }
    .toggle input { margin-right:6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="ui">
    <div class="row"><b>篩選 AOC 名稱（自由輸入，支援重音去除與模糊比對）</b></div>
    <div class="row">
      <input id="q" type="text" placeholder="例如：Meursault / La Tâche / Aux Boudots">
      <button class="btn" id="clear">清除</button>
      <button class="btn" id="all">全部</button>
    </div>

    <div class="row">
      <label class="small">地形陰影透明度</label>
      <input id="hsOpacity" type="range" min="0" max="100" value="45" style="flex:1">
      <span id="hsVal" class="small">45%</span>
    </div>

    <div class="row toggle">
      <label><input type="checkbox" id="toggleHill" checked>顯示地形陰影</label>
      <label><input type="checkbox" id="toggleAOC" checked>顯示 AOC 產區</label>
      <label><input type="checkbox" id="toggleWineries">顯示酒莊（若有）</label>
      <button class="btn" id="resetView">重設視角</button>
    </div>
    <div class="small">底圖：OpenStreetMap · 陰影：Esri World Hillshade（免金鑰）</div>
  </div>

  <div class="legend">
    <div class="item"><span class="swatch gc"></span> Grand Cru</div>
    <div class="item"><span class="swatch pc"></span> Premier Cru</div>
    <div class="item"><span class="swatch vi"></span> Village</div>
    <div class="item"><span class="swatch re"></span> Régionale / 其他</div>
  </div>

  <script>
    // ========= 檔名設定 =========
    const AOC_FILE = './burgundy.geojson';      // 必須存在
    const WINERY_FILE = './wineries.geojson';   // 可選

    // ========= 地圖初始化（MapLibre GL）=========
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          // OSM 遮罩底圖
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap · INAO/IGN (Open Licence 2.0)'
          },
          hillshade: {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Esri World Hillshade © Esri, USGS, NOAA'
          }
        },
        layers: [
          { id:'osm', type:'raster', source:'osm' },
          { id:'hillshade', type:'raster', source:'hillshade', paint:{ 'raster-opacity': 0.45 } }
        ]
      },
      center: [4.8, 47.0],
      zoom: 8.8,
      pitch: 55,   // 可傾斜視角
      bearing: -10,
      hash: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // ========= 名稱處理工具 =========
    function norm(s=''){
      return s.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')    // 去重音
        .replace(/['’·.`´]/g,'')                            // 去標點
        .replace(/\s+/g,' ')
        .trim();
    }

    // ——— Grand Cru 與 Village 名單（完整）———
    const GRAND_CRU = [
      "Chambertin","Chambertin-Clos de Bèze","Mazis-Chambertin","Charmes-Chambertin","Griotte-Chambertin","Latricières-Chambertin","Ruchottes-Chambertin","Mazoyères-Chambertin",
      "Clos de la Roche","Clos Saint-Denis","Clos des Lambrays","Clos de Tart","Bonnes-Mares","Musigny","Clos de Vougeot",
      "Échezeaux","Grands Échezeaux","Richebourg","Romanée-Conti","La Romanée","Romanée-Saint-Vivant","La Tâche","La Grande Rue",
      "Corton","Corton-Charlemagne","Charlemagne",
      "Montrachet","Bâtard-Montrachet","Chevalier-Montrachet","Criots-Bâtard-Montrachet","Bienvenues-Bâtard-Montrachet",
      "Chablis Grand Cru"
    ];
    const GC_N = GRAND_CRU.map(n => norm(n));

    const VILLAGES = [
      "Chablis","Marsannay","Fixin","Gevrey-Chambertin","Morey-Saint-Denis","Chambolle-Musigny","Vougeot","Flagey-Échezeaux","Vosne-Romanée","Nuits-Saint-Georges",
      "Côte de Nuits-Villages","Ladoix","Aloxe-Corton","Pernand-Vergelesses","Chorey-lès-Beaune","Savigny-lès-Beaune","Beaune","Pommard","Volnay","Monthelie","Auxey-Duresses","Saint-Romain",
      "Meursault","Blagny","Puligny-Montrachet","Chassagne-Montrachet","Saint-Aubin","Santenay","Maranges","Côte de Beaune-Villages",
      "Bouzeron","Rully","Mercurey","Givry","Montagny",
      "Pouilly-Fuissé","Pouilly-Loché","Pouilly-Vinzelles","Saint-Véran","Viré-Clessé",
      "Mâcon","Saint-Amour","Juliénas","Chénas"
    ];
    const VILLAGES_N = VILLAGES.map(n => norm(n));

    // Grand Cru 地理所在村（為地理說明，非法定隸屬）
    const GC_VILLAGES = {
      "Chambertin":["Gevrey-Chambertin"],
      "Chambertin-Clos de Bèze":["Gevrey-Chambertin"],
      "Mazis-Chambertin":["Gevrey-Chambertin"],
      "Charmes-Chambertin":["Gevrey-Chambertin"],
      "Griotte-Chambertin":["Gevrey-Chambertin"],
      "Latricières-Chambertin":["Gevrey-Chambertin"],
      "Ruchottes-Chambertin":["Gevrey-Chambertin"],
      "Mazoyères-Chambertin":["Gevrey-Chambertin"],
      "Clos de la Roche":["Morey-Saint-Denis"],
      "Clos Saint-Denis":["Morey-Saint-Denis"],
      "Clos des Lambrays":["Morey-Saint-Denis"],
      "Clos de Tart":["Morey-Saint-Denis"],
      "Bonnes-Mares":["Chambolle-Musigny","Morey-Saint-Denis"],
      "Musigny":["Chambolle-Musigny"],
      "Clos de Vougeot":["Vougeot"],
      "Échezeaux":["Flagey-Échezeaux"],
      "Grands Échezeaux":["Flagey-Échezeaux"],
      "Richebourg":["Vosne-Romanée"],
      "Romanée-Conti":["Vosne-Romanée"],
      "La Romanée":["Vosne-Romanée"],
      "Romanée-Saint-Vivant":["Vosne-Romanée"],
      "La Tâche":["Vosne-Romanée"],
      "La Grande Rue":["Vosne-Romanée"],
      "Corton":["Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"],
      "Corton-Charlemagne":["Aloxe-Corton","Pernand-Vergelesses","Ladoix-Serrigny"],
      "Charlemagne":["Aloxe-Corton","Pernand-Vergelesses"],
      "Montrachet":["Puligny-Montrachet","Chassagne-Montrachet"],
      "Bâtard-Montrachet":["Puligny-Montrachet","Chassagne-Montrachet"],
      "Chevalier-Montrachet":["Puligny-Montrachet"],
      "Criots-Bâtard-Montrachet":["Chassagne-Montrachet"],
      "Bienvenues-Bâtard-Montrachet":["Puligny-Montrachet"],
      "Chablis Grand Cru":["Chablis"]
    };

    function isRegional(s=''){
      return /(bourgogne|coteaux bourguignons|grand ordinaire|ordinaire|côte d'or|hautes côtes|crémant|mousseux|aligot[ée])/i.test(s);
    }
    function cleanClimat(s){
      return (s||'')
        .replace(/^climat\s+de\s+bourgogne\s*/i,'')
        .replace(/^\s*(de|du|des|la|le|les|l’|l')\s+/i,'')
        .trim();
    }

    // 將 denom 分段後，針對每段再拆「ou / or / /」替代寫法
    function expandAltNames(parts){
      const out = [];
      for (const p of parts){
        const alts = p.split(/\s+ou\s+|\s+or\s+|\//i).map(s=>s.trim()).filter(Boolean);
        out.push(...alts);
      }
      return out;
    }

    // —— 核心解析：回傳 {level, title, subtitle} ——（只取一個主名稱）
    function parseAOC(props){
      const denom = String(props?.denom || '');
      const parts = denom.split(',').map(s=>s.trim()).filter(Boolean);
      const altNames = expandAltNames(parts);
      const altN = altNames.map(norm);

      // 1) Grand Cru（嚴格：以「等值比對」為主，避免 Chambertin 誤打在 Gevrey-Chambertin）
      const gcHits = GRAND_CRU.filter((gc,i) => altN.includes(GC_N[i]));
      if (gcHits.length){
        // 多 GC 命中時，取「名稱較長」者（例：Chambertin-Clos de Bèze 優先於 Chambertin）
        const title = gcHits.sort((a,b)=>b.length-a.length)[0];
        const villages = GC_VILLAGES[title] || [];
        return { level:'GC', title, subtitle: villages.length ? `地點：${villages.join(' / ')}` : '' };
      }
      // 保險：處理「Grand Cru - X / X Grand Cru」寫法
      for (const s of parts){
        let m = s.match(/Grand\s*Cru\s*[-–—:]\s*(.+)$/i) || s.match(/^(.+?)\s+Grand\s*Cru$/i);
        if (m && m[1]){
          const title = cleanClimat(m[1]);
          const villages = GC_VILLAGES[title] || [];
          return { level:'GC', title, subtitle: villages.length ? `地點：${villages.join(' / ')}` : '' };
        }
      }

      // 2) Premier Cru（優先抓 climat；否則 "<村> Premier Cru"）
      const pcParts = parts.filter(s => /(premier|1er)\s*cru/i.test(s));
      if (pcParts.length){
        let climat = null;
        for (const s of pcParts){
          const m = s.match(/(?:premier|1er)\s*cru\s*(?:[-–—:]\s*|\s+)(.+)$/i);
          if (m && m[1]){ climat = cleanClimat(m[1]); break; }
        }
        if (!climat){
          // 從其餘分段挑「非 regional / 非 village / 非 GC/PC」的最短名當 climat
          const cand = altNames.filter(n => !isRegional(n) && !/(grand|premier|1er)\s*cru/i.test(n) && !VILLAGES_N.includes(norm(n)));
          if (cand.length) climat = cand.sort((a,b)=>a.length-b.length)[0];
        }
        // 找村名（若 PC 段落本身有村名也會被抓到）
        let village = null;
        for (const n of altNames){ if (VILLAGES_N.includes(norm(n))) { village = n; break; } }
        if (!village){
          const m = pcParts[0].match(/^(.+?)\s+(?:premier|1er)\s*cru/i);
          if (m && m[1]) village = m[1].trim();
        }
        return {
          level:'PC',
          title: climat ? climat : (village ? `${village} Premier Cru` : 'Premier Cru'),
          subtitle: village ? `${village} Premier Cru` : ''
        };
      }

      // 3) Village
      for (const n of altNames){
        if (VILLAGES_N.includes(norm(n))) {
          return { level:'VI', title: n, subtitle:'Village' };
        }
      }

      // 4) Regional / 其他
      return { level:'RE', title: altNames[0] || 'AOC', subtitle:'Régionale / 其他' };
    }

    // —— 預處理：把 level/title/subtitle 寫回 feature properties，供樣式＆彈窗使用 ——
    function preprocessAOCFeature(f){
      const info = parseAOC(f.properties || {});
      f.properties.aoc_level = info.level;      // GC/PC/VI/RE
      f.properties.aoc_title = info.title;      // 主名稱
      f.properties.aoc_subtitle = info.subtitle || '';
      f.properties.search_denom = norm(String(f.properties?.denom || '')); // 用於搜尋
      return f;
    }

    // ========= AOC & 酒莊載入 =========
    let aocData = null;
    let wineriesData = null;

    async function loadData(){
      // AOC
      const aocRes = await fetch(AOC_FILE);
      const aocFC = await aocRes.json();
      aocData = {
        type: 'FeatureCollection',
        features: (aocFC.features || []).map(preprocessAOCFeature)
      };

      // 建立來源與圖層
      if (!map.getSource('aoc')) {
        map.addSource('aoc', { type:'geojson', data: aocData });

        // 填色（依等級）
        map.addLayer({
          id:'aoc-fill',
          type:'fill',
          source:'aoc',
          paint:{
            'fill-color': [
              'match', ['get','aoc_level'],
              'GC', '#cc0033',
              'PC', '#ff7f0e',
              'VI', '#1f77b4',
                    '#2ca02c'  // RE
            ],
            'fill-opacity': [
              'match', ['get','aoc_level'],
              'GC', 0.18,
              'PC', 0.16,
              'VI', 0.14,
                    0.12
            ]
          }
        });

        // 邊線
        map.addLayer({
          id:'aoc-line',
          type:'line',
          source:'aoc',
          paint:{
            'line-color': [
              'match', ['get','aoc_level'],
              'GC', '#cc0033',
              'PC', '#ff7f0e',
              'VI', '#1f77b4',
                    '#2ca02c'
            ],
            'line-width': [
              'match', ['get','aoc_level'],
              'GC', 1.6,
              'PC', 1.4,
              'VI', 1.2,
                    1.0
            ]
          }
        });

        // 滑過高亮
        map.addLayer({
          id:'aoc-hover',
          type:'line',
          source:'aoc',
          paint:{ 'line-color':'#000', 'line-width': 2.4 },
          filter: ['==', ['get','gml_id'], '___none___']
        });

        map.on('mousemove', 'aoc-fill', (e)=>{
          const f = e.features && e.features[0];
          map.getCanvas().style.cursor = f ? 'pointer' : '';
          map.setFilter('aoc-hover', f ? ['==', ['get','gml_id'], f.properties?.gml_id || ''] : ['==', ['get','gml_id'], '___none___']);
        });

        // 點擊彈窗（只顯示主名稱與等級；GC 顯示地理村名）
        map.on('click', 'aoc-fill', (e)=>{
          const f = e.features && e.features[0];
          if (!f) return;
          const p = f.properties || {};
          const levelText = {GC:'Grand Cru', PC:'Premier Cru', VI:'Village', RE:'Régionale / 其他'}[p.aoc_level] || 'AOC';
          const sub = p.aoc_subtitle ? `（${p.aoc_subtitle}）` : '';
          const idLine = p.gml_id ? `<hr style="border:none;border-top:1px solid #eee;margin:8px 0"><small>ID：${p.gml_id}</small>` : '';
          const html = `<div style="min-width:260px">
                          <div style="font-weight:700">${p.aoc_title || 'AOC'}</div>
                          <div class="small" style="color:#666;margin-top:4px">等級：${levelText}${sub}</div>
                          ${idLine}
                        </div>`;
          new maplibregl.Popup({ closeOnClick:true })
            .setLngLat(e.lngLat)
            .setHTML(html)
            .addTo(map);
        });
      } else {
        // 若已存在來源，更新資料（供之後動態重載）
        map.getSource('aoc').setData(aocData);
      }

      // 嘗試載入酒莊（可選）
      try {
        const wRes = await fetch(WINERY_FILE);
        wineriesData = await wRes.json();

        if (!map.getSource('wineries')){
          map.addSource('wineries', { type:'geojson', data:wineriesData });
          // 以圓點表示
          map.addLayer({
            id:'winery-pt',
            type:'circle',
            source:'wineries',
            paint:{
              'circle-radius': 4.2,
              'circle-color': '#6A0DAD',
              'circle-stroke-color': '#fff',
              'circle-stroke-width': 1
            }
          });
          map.on('click','winery-pt',(e)=>{
            const f = e.features && e.features[0];
            if (!f) return;
            const p = f.properties || {};
            const tel = p.phone ? `<br>☎️ <a href="tel:${String(p.phone).replace(/\s/g,'')}">${p.phone}</a>` : '';
            const web = p.website ? `<br>🌐 <a href="${p.website}" target="_blank" rel="noopener">官方網站</a>` : '';
            const html = `<b>${p.name||'酒莊'}</b>${p.address?`<br>📍 ${p.address}`:''}${tel}${web}`;
            new maplibregl.Popup({ closeOnClick:true }).setLngLat(e.lngLat).setHTML(html).addTo(map);
          });
          // 初始為關閉（照 UI 開關）
          map.setLayoutProperty('winery-pt', 'visibility', 'none');
        } else {
          map.getSource('wineries').setData(wineriesData);
        }
      } catch(err){
        console.warn('未找到 wineries.geojson（略過酒莊圖層）');
      }
    }

    map.on('load', loadData);

    // ========= UI：搜尋 / 陰影透明度 / 圖層切換 / 重置視角 =========
    const qInput = document.getElementById('q');
    const btnClear = document.getElementById('clear');
    const btnAll = document.getElementById('all');
    const hsSlider = document.getElementById('hsOpacity');
    const hsVal = document.getElementById('hsVal');
    const toggleHill = document.getElementById('toggleHill');
    const toggleAOC = document.getElementById('toggleAOC');
    const toggleWineries = document.getElementById('toggleWineries');
    const btnReset = document.getElementById('resetView');

    function setAOCFilter(qRaw){
      const q = norm(qRaw || '');
      if (!map.getLayer('aoc-fill')) return;
      if (!q) {
        map.setFilter('aoc-fill', null);
        map.setFilter('aoc-line', null);
        return;
      }
      // 用 search_denom（已預處理）做子字串比對
      const expr = ['>=', ['index-of', q, ['get','search_denom']], 0];
      map.setFilter('aoc-fill', expr);
      map.setFilter('aoc-line', expr);
    }

    let t=null;
    qInput.addEventListener('input', ()=>{
      clearTimeout(t);
      t = setTimeout(()=> setAOCFilter(qInput.value), 220);
    });
    btnClear.onclick = ()=> { qInput.value=''; setAOCFilter(''); };
    btnAll.onclick = ()=> { qInput.value=''; setAOCFilter(''); };

    hsSlider.oninput = ()=>{
      const v = Number(hsSlider.value)||0;
      hsVal.textContent = v+'%';
      if (map.getLayer('hillshade'))
        map.setPaintProperty('hillshade','raster-opacity', v/100);
    };

    toggleHill.onchange = ()=>{
      if (!map.getLayer('hillshade')) return;
      map.setLayoutProperty('hillshade', 'visibility', toggleHill.checked ? 'visible' : 'none');
    };
    toggleAOC.onchange = ()=>{
      ['aoc-fill','aoc-line','aoc-hover'].forEach(id=>{
        if (map.getLayer(id))
          map.setLayoutProperty(id, 'visibility', toggleAOC.checked ? 'visible' : 'none');
      });
    };
    toggleWineries.onchange = ()=>{
      if (map.getLayer('winery-pt'))
        map.setLayoutProperty('winery-pt', 'visibility', toggleWineries.checked ? 'visible' : 'none');
    };

    btnReset.onclick = ()=>{
      map.easeTo({ center:[4.8, 47.0], zoom:8.8, pitch:55, bearing:-10, duration:800 });
    };
  </script>
</body>
</html>
